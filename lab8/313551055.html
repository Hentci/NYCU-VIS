<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Evaluation Sankey Diagram</title>
    <link rel="stylesheet" href="313551055.css" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Car Evaluation Analysis</h1>
            <p class="text-gray-600">Interactive Sankey Diagram Visualization</p>
        </header>

        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <div class="mb-4">
                <div class="flex space-x-4 mb-4" id="controls">
                    <button id="resetBtn" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition">
                        Reset View
                    </button>
                </div>
            </div>
            <div class="overflow-auto relative">
                <svg id="sankey-diagram" width="1000" height="600"></svg>
            </div>
        </div>

        <footer class="text-center text-gray-600">
            <p>Student ID: 313551055</p>
            <p class="text-sm mt-2">Data source: UCI Car Evaluation Dataset</p>
            <div class="mt-4 text-sm">
                <p><strong>Usage Instructions:</strong></p>
                <ul class="list-disc list-inside">
                    <li>Drag nodes vertically to reorganize the diagram</li>
                    <li>Click the Reset View button to restore the original layout</li>
                </ul>
            </div>
        </footer>
    </div>

    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="313551055.js"></script>
</body>
</html>
