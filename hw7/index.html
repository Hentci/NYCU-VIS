<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Pollution Horizon Charts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Only include the necessary Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="313551055.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">Air Pollution in Seoul</h1>
            <p class="subtitle">Analysis of Air Quality Data through Horizon Charts</p>
        </header>

        <div class="controls-container">
            <!-- Pollutant selector -->
            <div class="pollutant-controls">
                <h6 class="control-label">Select Pollutant</h6>
                <div class="pollutant-selector">
                    <input type="radio" class="btn-check" name="type" id="SO2" value="SO2" checked>
                    <label class="btn btn-outline-primary" for="SO2">SO₂</label>

                    <input type="radio" class="btn-check" name="type" id="NO2" value="NO2">
                    <label class="btn btn-outline-primary" for="NO2">NO₂</label>

                    <input type="radio" class="btn-check" name="type" id="O3" value="O3">
                    <label class="btn btn-outline-primary" for="O3">O₃</label>

                    <input type="radio" class="btn-check" name="type" id="CO" value="CO">
                    <label class="btn btn-outline-primary" for="CO">CO</label>

                    <input type="radio" class="btn-check" name="type" id="PM10" value="PM10">
                    <label class="btn btn-outline-primary" for="PM10">PM₁₀</label>

                    <input type="radio" class="btn-check" name="type" id="PM25" value="PM2.5">
                    <label class="btn btn-outline-primary" for="PM25">PM₂.₅</label>
                </div>
            </div>

            <!-- Year selector -->
            <div class="year-controls">
                <h6 class="control-label">Select Year</h6>
                <select class="form-select" id="yearSelect">
                    <option value="2017">2017</option>
                    <option value="2018">2018</option>
                    <option value="2019">2019</option>
                </select>
            </div>
        </div>

        <div class="chart-section">
            <div id="loading" class="loading-spinner">
                <div class="spinner-border text-primary"></div>
            </div>
            <div id="horizon-chart"></div>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <p class="student-id">Student ID: 313551055</p>
                <p class="data-source">Data source: Seoul Air Pollution Dataset</p>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="https://unpkg.com/horizon-timeseries-chart"></script>
    <script src="313551055.js"></script>
</body>
</html>
